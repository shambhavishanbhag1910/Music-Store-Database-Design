name: Music Store Data Platform CI

on:
  push:
    branches:
      - main
      - production-data-platform

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. CODE QUALITY
  # ============================================================
  quality:
    name: Ruff and Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check src tests scripts airflow/dags

      - name: Run unit tests
        run: |
          pytest -q


  # ============================================================
  # 2. DATABASE + ETL INTEGRATION TEST
  # ============================================================
  integration:
    name: ETL Integration Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          OLTP_HOST=oltp-db
          OLTP_PORT=5432
          OLTP_DB=music_store
          OLTP_USER=music_app
          OLTP_PASSWORD=ci_music_password

          WAREHOUSE_HOST=warehouse-db
          WAREHOUSE_PORT=5432
          WAREHOUSE_DB=music_warehouse
          WAREHOUSE_USER=warehouse_app
          WAREHOUSE_PASSWORD=ci_warehouse_password

          PIPELINE_NAME=music_store_ci
          EXTRACT_OVERLAP_MINUTES=5
          PIPELINE_LOG_LEVEL=INFO

          AIRFLOW_DB=airflow
          AIRFLOW_DB_USER=airflow
          AIRFLOW_DB_PASSWORD=ci_airflow_password

          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=ci_grafana_password

          GRAFANA_SMTP_HOST=smtp.gmail.com:587
          GRAFANA_SMTP_USER=
          GRAFANA_SMTP_PASSWORD=
          GRAFANA_SMTP_FROM_ADDRESS=
          EOF

      - name: Start OLTP and warehouse databases
        run: |
          docker compose up -d --wait oltp-db warehouse-db

      - name: Show container status
        run: |
          docker compose ps

      - name: Test database connectivity
        run: |
          docker compose --profile tools run --rm pipeline \
            music-store-etl health

      - name: Generate deterministic test data
        run: |
          docker compose --profile tools run --rm pipeline \
            python scripts/generate_demo_data.py \
            --reset \
            --customers 60 \
            --artists 20 \
            --albums 40 \
            --tracks 300 \
            --orders 300 \
            --seed 42

      - name: Run ETL first time
        run: |
          docker compose --profile tools run --rm pipeline \
            music-store-etl run

      - name: Capture warehouse counts
        id: first_counts
        shell: bash
        run: |
          SALES=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "SELECT COUNT(*) FROM warehouse.fact_sales;")

          PAYMENTS=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "SELECT COUNT(*) FROM warehouse.fact_payment;")

          echo "sales=$SALES" >> "$GITHUB_OUTPUT"
          echo "payments=$PAYMENTS" >> "$GITHUB_OUTPUT"

          echo "First run fact_sales=$SALES"
          echo "First run fact_payment=$PAYMENTS"

          test "$SALES" -gt 0
          test "$PAYMENTS" -gt 0

      - name: Run ETL second time
        run: |
          docker compose --profile tools run --rm pipeline \
            music-store-etl run

      - name: Verify idempotency
        shell: bash
        run: |
          SALES=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "SELECT COUNT(*) FROM warehouse.fact_sales;")

          PAYMENTS=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "SELECT COUNT(*) FROM warehouse.fact_payment;")

          echo "Second run fact_sales=$SALES"
          echo "Second run fact_payment=$PAYMENTS"

          test "$SALES" = "${{ steps.first_counts.outputs.sales }}"
          test "$PAYMENTS" = "${{ steps.first_counts.outputs.payments }}"

      - name: Verify latest ETL succeeded
        run: |
          STATUS=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "SELECT status
             FROM audit.etl_run
             ORDER BY started_at DESC
             LIMIT 1;")

          echo "Latest ETL status=$STATUS"
          test "$STATUS" = "success"

      - name: Verify critical DQ checks
        run: |
          FAILED=$(docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -Atc \
            "WITH latest AS (
                 SELECT run_id
                 FROM audit.etl_run
                 ORDER BY started_at DESC
                 LIMIT 1
             )
             SELECT COUNT(*)
             FROM audit.dq_result d
             JOIN latest l
               ON l.run_id = d.run_id
             WHERE d.severity = 'error'
               AND d.passed = false;")

          echo "Critical DQ failures=$FAILED"
          test "$FAILED" = "0"

      - name: Print recent ETL history
        if: always()
        run: |
          docker compose exec -T warehouse-db \
            psql -U warehouse_app -d music_warehouse -c \
            "SELECT run_id,
                    status,
                    rows_extracted,
                    rows_loaded,
                    error_message
             FROM audit.etl_run
             ORDER BY started_at DESC
             LIMIT 5;" || true

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs oltp-db warehouse-db || true

      - name: Shut down integration environment
        if: always()
        run: |
          docker compose down -v --remove-orphans


  # ============================================================
  # 3. DOCKER BUILD VALIDATION
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pipeline image
        run: |
          docker build \
            -f docker/Dockerfile.pipeline \
            -t music-store-pipeline:ci \
            .

      - name: Build Airflow image
        run: |
          docker build \
            -f docker/Dockerfile.airflow \
            -t music-store-airflow:ci \
            .