[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-store-data-platform"
version = "1.0.0"
description = "Production-shaped data engineering and analytics platform for a music store"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<0.13",
]

[project.scripts]
music-store-etl = "music_store_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
